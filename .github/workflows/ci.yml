name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:
  workflow_dispatch:

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

# Installer builds and publishing to the website download channel live in
# release.yml (triggered by v* tags); website deploys in deploy-website.yml.
